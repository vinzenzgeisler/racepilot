services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: racepilot
      POSTGRES_PASSWORD: racepilot
      POSTGRES_DB: racepilot_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - racepilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U racepilot -d racepilot_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: racepilot
      MINIO_ROOT_PASSWORD: racepilot-local
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - racepilot-minio:/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  racepilot-minio:
  racepilot-postgres:
