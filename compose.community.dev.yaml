services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: racepilot
      POSTGRES_PASSWORD: racepilot-local
      POSTGRES_DB: racepilot
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - community-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U racepilot -d racepilot']
      interval: 2s
      timeout: 2s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Generated by community-up script}
      KC_HOSTNAME: http://127.0.0.1:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - community-keycloak:/opt/keycloak/data
  keycloak-prepare:
    image: busybox:1.37
    profiles: [prepare]
    command: sh -c 'mkdir -p /data/import && cp /source/nennbox-realm.json /data/import/nennbox-realm.json && chown -R 1000:0 /data'
    volumes:
      - community-keycloak:/data
      - ./.community-local/nennbox-realm.json:/source/nennbox-realm.json:ro
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  community-postgres:
  community-keycloak:
