name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository identity
        run: |
          actual="${GITHUB_REPOSITORY,,}"
          test "$actual" = "vinzenzgeisler/racepilot" || { echo "Unexpected repository: $GITHUB_REPOSITORY" >&2; exit 1; }
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_tenant_inventory.py
      - run: python3 scripts/check_relative_markdown_links.py
