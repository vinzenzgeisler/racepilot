name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository identity
        run: bash scripts/validate-repo-identity.sh

  lint:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  boundaries:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries

  docs:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant inventory and isolation matrix
        run: python3 scripts/validate_tenant_inventory.py
      - name: Validate product resource inventory
        run: python3 scripts/validate_product_inventory.py
      - name: Check relative Markdown links
        run: python3 scripts/check_relative_markdown_links.py

  integration:
    needs: repo-identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: racepilot
          POSTGRES_PASSWORD: racepilot
          POSTGRES_DB: racepilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U racepilot -d racepilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      RACEPILOT_TEST_DATABASE_URL: postgres://racepilot:racepilot@127.0.0.1:5432/racepilot_test
      DATABASE_URL: postgres://racepilot:racepilot@127.0.0.1:5432/racepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test -- --run packages/adapter-postgres/src/integration.test.ts

  core-community:
    name: core (community)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      RACEPILOT_TEST_MODE: community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker

  core-cloud:
    name: core (cloud)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      RACEPILOT_TEST_MODE: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker
