name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository identity
        run: bash scripts/validate-repo-identity.sh

  lint:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  pack-artifacts:
    needs: repo-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:pack
        env:
          RACEPILOT_PACK_DIR: /tmp/racepilot-product-artifacts

  boundaries:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries

  docs:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant inventory and isolation matrix
        run: python3 scripts/validate_tenant_inventory.py
      - name: Validate product resource inventory
        run: python3 scripts/validate_product_inventory.py
      - name: Check relative Markdown links
        run: python3 scripts/check_relative_markdown_links.py

  integration:
    needs: repo-identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: racepilot
          POSTGRES_PASSWORD: racepilot
          POSTGRES_DB: racepilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U racepilot -d racepilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      RACEPILOT_TEST_DATABASE_URL: postgres://racepilot:racepilot@127.0.0.1:5432/racepilot_test
      DATABASE_URL: postgres://racepilot:racepilot@127.0.0.1:5432/racepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test -- --run --no-file-parallelism $(find packages -type f \( -name '*.integration.test.ts' -o -name 'integration.test.ts' \) -print)

  core-community:
    name: core (community)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      RACEPILOT_TEST_MODE: community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker

  core-cloud:
    name: core (cloud)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      RACEPILOT_TEST_MODE: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker

  community-smoke:
    needs: repo-identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Community stack
        run: |
          COMMUNITY_PRINT_PASSWORD=0 bash scripts/community-up.sh > /tmp/community-up.log 2>&1 &
          echo $! > /tmp/community-up.pid
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:5173/app >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/community-up.pid)" 2>/dev/null; then
              cat /tmp/community-up.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/community-up.log
          exit 1
      - name: Browser login smoke test
        run: COMMUNITY_ADMIN_PASSWORD="$(node scripts/community-config.mjs --password)" npx playwright test --config packages/app/playwright.config.ts
      - name: Upload alpha-flow browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-flow-screenshots
          path: packages/app/test-results/
          if-no-files-found: warn
      - name: Stop local Community stack
        if: always()
        run: |
          kill "$(cat /tmp/community-up.pid)" 2>/dev/null || true
          docker compose --env-file .community-local/compose.env -f compose.community.dev.yaml down 2>/dev/null || true
